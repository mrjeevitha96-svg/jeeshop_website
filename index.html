<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="JeeShop - A modern everyday shopping experience."
  >

  <meta
    name="theme-color"
    content="#23483d"
  >

  <title>JeeShop | Everyday Shopping</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <a href="#/" class="logo" aria-label="JeeShop home">
      <span class="logo-mark">J</span>
      <span>JeeShop</span>
    </a>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="#/">Home</a>
      <a href="#/shop">Shop</a>
      <a href="#/about">About</a>
      <a href="#/contact">Contact</a>
    </nav>

    <div class="header-actions">

      <button
        class="icon-button"
        id="searchButton"
        aria-label="Open search"
        type="button"
      >
        <span>⌕</span>
      </button>

      <button
        class="bag-button"
        id="cartButton"
        aria-label="Open shopping bag"
        type="button"
      >
        Bag
        <span id="cartCount">0</span>
      </button>

      <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu"
        aria-expanded="false"
        type="button"
      >
        ☰
      </button>

    </div>

  </header>


  <!-- MOBILE NAV -->
  <nav
    class="mobile-nav"
    id="mobileNav"
    aria-label="Mobile navigation"
  >
    <a href="#/">Home</a>
    <a href="#/shop">Shop</a>
    <a href="#/about">About</a>
    <a href="#/contact">Contact</a>
  </nav>


  <!-- SEARCH -->
  <div
    class="search-overlay"
    id="searchOverlay"
    aria-hidden="true"
  >

    <div class="search-box">

      <button
        class="close-button"
        id="closeSearch"
        aria-label="Close search"
        type="button"
      >
        ×
      </button>

      <span class="eyebrow">SEARCH JEE SHOP</span>

      <h2>What are you looking for?</h2>

      <div class="search-input-wrap">

        <input
          type="search"
          id="searchInput"
          placeholder="Search products..."
          aria-label="Search products"
        >

        <button
          id="searchSubmit"
          type="button"
        >
          Search
        </button>

      </div>

    </div>

  </div>


  <!-- MAIN APPLICATION -->
  <main id="app"></main>


  <!-- CART DRAWER -->
  <aside
    class="cart-drawer"
    id="cartDrawer"
    aria-label="Shopping bag"
    aria-hidden="true"
  >

    <div class="cart-header">

      <div>
        <span class="eyebrow">YOUR BAG</span>
        <h2>Shopping bag</h2>
      </div>

      <button
        id="closeCart"
        class="close-button"
        aria-label="Close shopping bag"
        type="button"
      >
        ×
      </button>

    </div>

    <div
      class="cart-items"
      id="cartItems"
    ></div>

    <div class="cart-footer">

      <div class="cart-total-row">
        <span>Total</span>
        <strong id="cartTotal">₹0</strong>
      </div>

      <button
        class="primary-button full-button"
        id="checkoutButton"
        type="button"
      >
        Checkout
      </button>

    </div>

  </aside>


  <!-- BACKDROP -->
  <div
    class="backdrop"
    id="backdrop"
  ></div>


  <!-- TOAST -->
  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>


  <script src="script.js" defer></script>

</body>
</html>
